name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build
        run: mvn -B -DskipTests package

      - name: List artifacts
        run: ls -lh target/*.jar || true

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: power-mobs-${{ github.sha }}
          path: target/power-mobs-*.jar
          if-no-files-found: error
          retention-days: 30
