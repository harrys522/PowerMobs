name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version
        run: mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build shaded jar
        run: mvn -B -DskipTests package

      - name: Locate jar
        id: jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name 'power-mobs-*.jar' -not -name 'original-*' | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No release jar found under target/"
            ls -lh target/ || true
            exit 1
          fi
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "JAR_NAME=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: hash
        run: |
          HASH=$(sha256sum "${{ steps.jar.outputs.JAR_PATH }}" | awk '{print $1}')
          echo "SHA256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::No CHANGELOG.md found"
            {
              echo "BODY<<CHANGELOG_EOF"
              echo "_No CHANGELOG.md in this revision._"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prefer an exact version section like "V1.3.1 - ...";
          # fall back to "Unreleased" otherwise.
          VERSION="${{ steps.version.outputs.VERSION }}"
          SECTION=$(awk -v v="V${VERSION}" '
            $0 ~ "^"v"( |$)" {flag=1; next}
            flag && /^V[0-9]/ {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            SECTION=$(awk '
              /^Unreleased( |$)/ {flag=1; next}
              flag && /^V[0-9]/ {flag=0}
              flag {print}
            ' CHANGELOG.md)
          fi
          if [ -z "$SECTION" ]; then
            SECTION="_No CHANGELOG entry for this release._"
          fi
          {
            echo "BODY<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.JAR_NAME }}
          path: ${{ steps.jar.outputs.JAR_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PowerMobs ${{ steps.version.outputs.VERSION }}
          files: ${{ steps.jar.outputs.JAR_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') && 'true' || 'false' }}
          body: |
            ## PowerMobs ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.BODY }}

            ---

            **Asset:** `${{ steps.jar.outputs.JAR_NAME }}`
            **SHA-256:** `${{ steps.hash.outputs.SHA256 }}`

            ### Nix consumption

            ```nix
            "plugins/PowerMobs.jar" = pkgs.fetchurl {
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.jar.outputs.JAR_NAME }}";
              sha256 = "${{ steps.hash.outputs.SHA256 }}";
            };
            ```
