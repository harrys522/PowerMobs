name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version
        run: mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build shaded jar
        run: mvn -B -DskipTests package

      - name: Locate jar
        id: jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name 'power-mobs-*.jar' -not -name 'original-*' | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::No release jar found under target/"
            ls -lh target/ || true
            exit 1
          fi
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "JAR_NAME=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: hash
        run: |
          HASH=$(sha256sum "${{ steps.jar.outputs.JAR_PATH }}" | awk '{print $1}')
          echo "SHA256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.JAR_PATH }}
          generate_release_notes: true
          body: |
            ## PowerMobs ${{ steps.version.outputs.VERSION }}

            **Asset:** `${{ steps.jar.outputs.JAR_NAME }}`
            **SHA-256:** `${{ steps.hash.outputs.SHA256 }}`

            ### Nix consumption

            ```nix
            "plugins/PowerMobs.jar" = pkgs.fetchurl {
              url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.jar.outputs.JAR_NAME }}";
              sha256 = "${{ steps.hash.outputs.SHA256 }}";
            };
            ```
